<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>INVENTARIO</title>
<style>
  :root {
    --navy: #0F2A43;
    --teal: #1C7A78;
    --teal-light: #E7F3F2;
    --ink: #1B2430;
    --muted: #66727E;
    --line: #DDE3E8;
    --paper: #FAFBFC;
    --danger: #B3261E;
    --row-h: 40px;
    --col-detalle: 90px;
    --col-codigo: 130px;
    --col-proveedor: 190px;
    --col-iva: 70px;
    --col-exi: 100px;
    --col-costo: 120px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--paper); color: var(--ink);
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header {
    background: var(--navy); color: #fff; padding: 9px 32px; flex: 0 0 auto;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: .02em; }
  header p { margin: 0; color: #B9C6D3; font-size: 0.78rem; }

  /* ---------- pantalla de carga ---------- */
  #loadScreen {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 28px; overflow: auto;
  }
  .load-box { width: 100%; max-width: 620px; text-align: center; }
  .load-box h2 { margin: 0 0 6px; font-size: 1.1rem; color: var(--navy); }
  .load-box > p { margin: 0 0 22px; color: var(--muted); font-size: 0.9rem; }
  .connect-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--teal); color: #fff; border: none; border-radius: 8px;
    padding: 13px 22px; font-size: 0.95rem; cursor: pointer; font-weight: 600;
  }
  .connect-btn:hover { background: #17615f; }
  .connect-btn:disabled { opacity: 0.6; cursor: default; }
  .dropzone {
    border: 2px dashed var(--line); border-radius: 12px; background: #fff;
    padding: 26px 20px; cursor: pointer; transition: border-color .15s, background .15s;
    margin-top: 18px;
  }
  .dropzone:hover, .dropzone.dragover { border-color: var(--teal); background: var(--teal-light); }
  .dropzone p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }
  .dropzone input[type=file] { display: none; }
  #loadStatus { margin-top: 16px; font-size: 0.85rem; color: var(--muted); min-height: 1.3em; white-space: pre-line; }
  #loadStatus.error { color: var(--danger); }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: none; gap: 14px; align-items: center; padding: 14px 32px;
    background: #fff; border-bottom: 1px solid var(--line); flex: 0 0 auto; z-index: 6; flex-wrap: wrap;
  }
  .toolbar input[type="search"] {
    flex: 1; min-width: 220px; max-width: 420px; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: 6px; font-size: 0.95rem;
  }
  .toolbar input[type="search"]:focus { outline: none; border-color: var(--teal); }
  .toolbar button {
    padding: 9px 16px; border: 1px solid var(--line); background: #fff; color: var(--navy);
    border-radius: 6px; font-size: 0.85rem; cursor: pointer;
  }
  .toolbar button:hover { background: var(--teal-light); border-color: var(--teal); }
  .count { color: var(--muted); font-size: 0.86rem; white-space: nowrap; margin-left: auto; }

  /* ---------- tabla virtual ---------- */
  #tableScreen { display: none; flex: 1 1 auto; flex-direction: column; overflow: hidden; padding: 0 32px 24px; min-height: 0; }
  .grid-row { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
  .grid-row > .c-detalle { width: var(--col-detalle); flex: 0 0 auto; text-align: center; }
  .grid-row > .c-codigo { width: var(--col-codigo); flex: 0 0 auto; }
  .grid-row > .c-proveedor { width: var(--col-proveedor); flex: 0 0 auto; }
  .grid-row > .c-iva { width: var(--col-iva); flex: 0 0 auto; text-align: right; }
  .grid-row > .c-exi { width: var(--col-exi); flex: 0 0 auto; text-align: right; }
  .grid-row > .c-costo { width: var(--col-costo); flex: 0 0 auto; text-align: right; }
  .grid-row > .c-nombre { flex: 1 1 auto; min-width: 0; }
  .grid-row > div { padding: 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .head-row {
    background: var(--teal-light); color: var(--navy); font-weight: 600; cursor: pointer;
    user-select: none; height: 40px; flex: 0 0 auto; border-bottom: 1px solid var(--teal);
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
  }
  .head-row > div { height: 100%; display: flex; align-items: center; }
  .head-row > div.c-iva, .head-row > div.c-exi, .head-row > div.c-costo { justify-content: flex-end; }
  .head-row > div:hover { background: #d9edec; }

  .filter-row { background: var(--teal-light); height: 46px; flex: 0 0 auto; border-bottom: 2px solid var(--teal); box-shadow: 0 1px 0 rgba(0,0,0,0.03); }
  .filter-row > div { display: flex; align-items: center; }
  .filter-row input, .filter-row select {
    width: 100%; padding: 6px 7px; font-size: 0.8rem; border: 1px solid var(--line);
    border-radius: 5px; box-sizing: border-box; font-weight: 400;
  }
  .filter-row input:focus, .filter-row select:focus { outline: none; border-color: var(--teal); }

  .viewport { flex: 1 1 auto; overflow: auto; position: relative; background: #fff; min-height: 0; }
  .scroller { position: relative; }
  .rows-window { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
  .grid-row.data-row { height: var(--row-h); }
  .grid-row.data-row:nth-child(even) { background: #F4F7F8; }
  .grid-row.data-row:hover { background: var(--teal-light); }
  .grid-row.data-row .c-codigo { color: var(--teal); font-weight: 600; }
  .detail-btn {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--teal); color: #fff; border: none; border-radius: 5px;
    width: 30px; height: 24px; font-size: 0.9rem; cursor: pointer; line-height: 1;
  }
  .detail-btn:hover { background: #17615f; }

  .empty { text-align: center; color: var(--muted); padding: 40px; display: none; }
  .arrow { font-size: 0.75em; color: var(--muted); margin-left: 4px; }

  /* ---------- modal ---------- */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,42,67,0.55); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: 10px; max-width: 640px; width: 100%; max-height: 82vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
  .modal-head { background: var(--navy); color: #fff; padding: 18px 24px; position: relative; }
  .modal-head .m-articulo { font-size: 0.78rem; color: #9FB4C6; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  .modal-head .m-nombre { font-size: 1.05rem; font-weight: 600; line-height: 1.3; padding-right: 30px; }
  .modal-head .m-sub { margin-top: 6px; font-size: 0.8rem; color: #B9C6D3; }
  .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; line-height: 1; opacity: .85; }
  .modal-close:hover { opacity: 1; }
  .modal-body { padding: 0; overflow-y: auto; }
  .modal-body table { width: 100%; font-size: 0.88rem; border-collapse: collapse; }
  .modal-body thead th { position: sticky; top: 0; background: var(--teal-light); color: var(--navy); padding: 10px 16px; text-align: left; border-bottom: 2px solid var(--teal); cursor: default; }
  .modal-body thead th.num { text-align: right; }
  .modal-body td { padding: 9px 16px; border-bottom: 1px solid var(--line); }
  .modal-body td.num { text-align: right; }
  .modal-body tr:nth-child(even) { background: #F7F9FA; }
  .modal-body .no-lotes { padding: 20px 24px; color: var(--muted); font-size: 0.88rem; }

  /* ---------- movimientos del articulo ---------- */
  #movScreen { display: none; flex: 1 1 auto; flex-direction: column; overflow: hidden; padding: 0 32px 20px; min-height: 0; background: var(--paper); }
  #movScreen.open { display: flex; }
  .mov-topbar {
    display: flex; align-items: center; gap: 12px; padding: 10px 0; flex: 0 0 auto;
    border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap;
  }
  .mov-topbar h2 { margin: 0; font-size: 0.98rem; font-weight: 600; color: var(--navy); }
  .mov-spacer { flex: 1 1 auto; }
  .mov-msg { color: var(--danger); font-size: 0.82rem; }
  .mov-back, .mov-load {
    display: inline-flex; align-items: center; padding: 8px 14px; border: 1px solid var(--line);
    background: #fff; color: var(--navy); border-radius: 6px; font-size: 0.85rem; cursor: pointer;
  }
  .mov-back:hover, .mov-load:hover { background: var(--teal-light); border-color: var(--teal); }
  .mov-load { display: none; }
  #movScreen.has-data .mov-load { display: inline-flex; }

  .mov-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; scrollbar-gutter: stable; }
  .mov-intro { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #movScreen.has-data .mov-intro { display: none; }
  .mov-drop {
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
    width: 100%; max-width: 480px; border: 2px dashed var(--line); border-radius: 12px;
    background: #fff; padding: 30px 20px; cursor: pointer;
  }
  .mov-drop:hover, .mov-drop.dragover { border-color: var(--teal); background: var(--teal-light); }
  .mov-drop strong { color: var(--navy); font-size: 0.98rem; }
  .mov-drop span { color: var(--muted); font-size: 0.82rem; }
  #movOut { flex: 0 0 auto; }

  #movScreen .hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 6px 0 10px; }
  #movScreen .hd h2 { margin: 0; font-size: 1.15rem; color: var(--navy); }
  #movScreen .hd span { color: var(--muted); font-size: 0.86rem; }
  #movScreen .tot { text-align: right; }
  #movScreen .tot small { display: block; color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: .04em; }
  #movScreen .tot b { font-size: 1.3rem; color: var(--navy); }
  #movScreen h3 { margin: 16px 0 6px; font-size: 0.74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #movScreen .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  #movScreen table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  #movScreen th, #movScreen td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  #movScreen th { background: var(--teal-light); color: var(--navy); font-size: 0.7rem; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; border-bottom: 2px solid var(--teal); }
  #movScreen tbody tr:last-child td { border-bottom: 0; }
  #movScreen tbody tr:hover td { background: var(--teal-light); }
  #movScreen .n { text-align: right; font-variant-numeric: tabular-nums; }
  #movScreen .neg { color: var(--danger); }
  #movScreen .doc { color: var(--teal); font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>INVENTARIO</h1>
  <p id="headerSubtitle">Combina Listado_de_articulos.xls + Resumen_de_existencias_UC.xls</p>
</header>

<!-- Pantalla de carga -->
<div id="loadScreen">
  <div class="load-box">
    <button class="connect-btn" id="connectBtn">&#128193; Conectar carpeta</button>

    <div class="dropzone" id="dropzone">
      <div><strong>Arrastra aqu&iacute; los dos archivos</strong></div>
      <input type="file" id="fileInput" accept=".xls,.xlsx,.htm,.html" multiple>
    </div>

    <div id="loadStatus"></div>
  </div>
</div>

<!-- Pantalla de tabla -->
<div id="tableScreen">
  <div class="toolbar" id="toolbar">
    <input type="search" id="searchBox" placeholder="Buscar por c&oacute;digo, nombre o proveedor...">
    <button id="refreshBtn">Actualizar datos</button>
    <button id="clearFilters">Limpiar filtros</button>
    <button id="loadAnother">Cambiar archivos</button>
    <button id="movBtn">Movimientos</button>
    <span class="count" id="rowCount"></span>
  </div>

  <div class="grid-row head-row" id="headRow">
    <div class="c-detalle">Detalle</div>
    <div class="c-codigo" data-key="codigo">C&oacute;digo</div>
    <div class="c-nombre" data-key="nombre">Nombre</div>
    <div class="c-proveedor" data-key="proveedor">Proveedor</div>
    <div class="c-iva" data-key="iva">Iva</div>
    <div class="c-exi" data-key="exi">Exi</div>
    <div class="c-costo" data-key="costo">Costo</div>
  </div>
  <div class="grid-row filter-row">
    <div class="c-detalle"></div>
    <div class="c-codigo"><input type="text" data-colfilter="codigo" placeholder="Filtrar..."></div>
    <div class="c-nombre"><input type="text" data-colfilter="nombre" placeholder="Filtrar..."></div>
    <div class="c-proveedor"><select data-colfilter="proveedor"><option value="">Todos</option></select></div>
    <div class="c-iva"><select data-colfilter="iva"><option value="">Todos</option></select></div>
    <div class="c-exi"><input type="text" data-colfilter="exi" placeholder="Filtrar..."></div>
    <div class="c-costo"><input type="text" data-colfilter="costo" placeholder="Filtrar..."></div>
  </div>
  <div class="viewport" id="viewport">
    <div class="scroller" id="scroller">
      <div class="rows-window" id="rowsWindow"></div>
    </div>
  </div>
  <div class="empty" id="emptyMsg">No se encontraron art&iacute;culos que coincidan con la b&uacute;squeda.</div>
</div>

<!-- Pantalla de movimientos -->
<div id="movScreen">
  <div class="mov-topbar">
    <button class="mov-back" id="movBackBtn">&#8592; Volver a inventario</button>
    <h2>Movimiento del art&iacute;culo</h2>
    <span class="mov-msg" id="movMsg"></span>
    <span class="mov-spacer"></span>
    <label class="mov-load" for="movFile">Revisar otro art&iacute;culo</label>
    <input type="file" id="movFile" accept=".xls,.xlsx,.html,.htm" hidden>
  </div>
  <div class="mov-scroll" id="movScroll">
    <div class="mov-intro" id="movIntro">
      <label class="mov-drop" id="movDropZone" for="movFile">
        <strong>Cargar Movimiento del Art&iacute;culo</strong>
        <span>Selecciona o arrastra el archivo (.xls, .xlsx o .html)</span>
      </label>
    </div>
    <div id="movOut"></div>
  </div>
</div>

<!-- Modal de lotes -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">&times;</button>
      <div class="m-articulo" id="modalArticulo"></div>
      <div class="m-nombre" id="modalNombre"></div>
      <div class="m-sub" id="modalSub"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
/* =============================================================================
   INVENTARIO - combina Listado_de_articulos + Existencias, 100% en el navegador.
   Reglas (segun Instrucciones.xlsm):
     Codigo    -> clave de referencia (abre la ficha con los lotes)
     Nombre    -> igual en ambos archivos (se usa el que exista)
     Proveedor -> igual en ambos archivos (se usa el que exista)
     Iva       -> solo en el archivo de Articulos (% Iva)
     Exi       -> solo en el archivo de Existencias, suma de todos los lotes
     Costo     -> solo en el archivo de Existencias, columna "Promedio",
                  se toma el mas alto entre los lotes de un mismo codigo
   ============================================================================= */

const FILE_NAMES = {
  articulos: ['Listado_de_articulos.xls', 'Listado_de_articulos.xlsx'],
  existencias: ['Resumen_de_existencias_UC.xls', 'Resumen_de_existencias_UC.xlsx']
};

let PRODUCTS = [];
let dirHandle = null;

// ---------------- utilidades numericas / texto ----------------

function toFloat(v) {
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return v;
  let s = String(v).trim();
  if (!s) return 0;
  // "35.000,00" (miles con punto, decimales con coma) vs "19.00" (decimal con punto, sin miles)
  if (s.includes(',')) {
    s = s.replace(/\./g, '').replace(',', '.');
  }
  const f = parseFloat(s);
  return isNaN(f) ? 0 : f;
}
function fmtNum(v) {
  const f = toFloat(v);
  let s = f.toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (s.endsWith(',00')) s = s.slice(0, -3);
  return s;
}
function fmtPct(v) {
  const f = toFloat(v);
  return (Number.isInteger(f) ? f : f) + '%';
}
function cleanLoteFecha(v) {
  const s = (v || '').trim();
  if (!s || /^\|+$/.test(s)) return '\u2014';
  return s;
}
function normalize(str) {
  return (str || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s === null || s === undefined ? '' : String(s);
  return d.innerHTML;
}

// ---------------- lectura generica de un archivo (html o binario) ----------------

function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}
function bytesToText(buf) {
  try { return new TextDecoder('windows-1252').decode(buf); }
  catch (e) { return new TextDecoder('utf-8').decode(buf); }
}
function loadSheetJS() {
  return new Promise((resolve, reject) => {
    if (window.XLSX) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('No se pudo cargar el interprete de Excel (se necesita internet para archivos .xlsx binarios).'));
    document.head.appendChild(s);
  });
}
function htmlTableToRows(tableEl) {
  const rows = [];
  for (const tr of tableEl.querySelectorAll('tr')) {
    const cells = tr.querySelectorAll('td,th');
    if (!cells.length) continue;
    rows.push(Array.from(cells).map(c => c.textContent.replace(/\s+/g, ' ').trim()));
  }
  return rows;
}
function findHeaderRow(rows, mustHaveAnyOf) {
  const wanted = mustHaveAnyOf.map(w => w.toLowerCase());
  for (let i = 0; i < rows.length; i++) {
    const lc = rows[i].map(c => c.toLowerCase().trim());
    if (wanted.some(w => lc.includes(w))) return i;
  }
  return -1;
}
function extractFromHtml(text, headerHints) {
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const tables = Array.from(doc.querySelectorAll('table'));
  if (!tables.length) throw new Error('El archivo no contiene ninguna tabla reconocible.');
  let best = null;
  for (const t of tables) {
    const rows = htmlTableToRows(t);
    const idx = findHeaderRow(rows, headerHints);
    if (idx !== -1) { best = { rows, headerIdx: idx }; break; }
  }
  if (!best) throw new Error('No se encontr\u00f3 el encabezado esperado (' + headerHints.join('/') + ') en el archivo.');
  return { header: best.rows[best.headerIdx], body: best.rows.slice(best.headerIdx + 1) };
}
async function extractFromBinary(arrayBuffer, headerHints) {
  await loadSheetJS();
  const wb = XLSX.read(arrayBuffer, { type: 'array' });
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }).map(r => r.map(c => String(c)));
    const idx = findHeaderRow(rows, headerHints);
    if (idx !== -1) return { header: rows[idx], body: rows.slice(idx + 1) };
  }
  throw new Error('No se encontr\u00f3 el encabezado esperado (' + headerHints.join('/') + ') en el archivo.');
}

// headerHints: encabezados que identifican cada archivo, para reconocerlo
// sin importar el orden de columnas.
async function parseWorkbookFile(file, headerHints) {
  const buf = await readFileAsArrayBuffer(file);
  const bytes = new Uint8Array(buf.slice(0, 8));
  if (bytes[0] === 0x50 && bytes[1] === 0x4B) return extractFromBinary(buf, headerHints); // zip -> xlsx
  if (bytes[0] === 0xD0 && bytes[1] === 0xCF) return extractFromBinary(buf, headerHints); // ole -> xls binario
  return extractFromHtml(bytesToText(buf), headerHints);
}

function colIndex(header, name) {
  const target = name.toLowerCase().trim();
  return header.findIndex(h => h.toLowerCase().trim() === target);
}

// ---------------- combinacion de los dos archivos ----------------

function buildInventario(articulosData, existenciasData) {
  const ah = articulosData.header, ab = articulosData.body;
  const eh = existenciasData.header, eb = existenciasData.body;

  const aiCodigo = colIndex(ah, 'codigo');
  const aiNombre = colIndex(ah, 'nombre');
  const aiProv = colIndex(ah, 'proveedor');
  const aiIva = colIndex(ah, '% iva');

  const eiArticulo = colIndex(eh, 'articulo');
  const eiNombre = colIndex(eh, 'nombre');
  const eiExi = eh.findIndex(h => h.toLowerCase().trim().startsWith('exi'));
  const eiProm = colIndex(eh, 'promedio');

  if (aiCodigo === -1 || aiNombre === -1) throw new Error('El archivo de Articulos no tiene las columnas "Codigo"/"Nombre" esperadas.');
  if (eiArticulo === -1) throw new Error('El archivo de Existencias no tiene la columna "Articulo" esperada.');

  const products = new Map();
  const order = [];

  for (const r of ab) {
    if (r.length <= Math.max(aiCodigo, aiNombre)) continue;
    const codigo = (r[aiCodigo] || '').trim();
    const nombre = (r[aiNombre] || '').trim();
    if (!codigo || !nombre) continue;
    if (/registro\(s\)/i.test(codigo)) continue; // fila de totales del reporte, no es un producto
    const proveedor = aiProv !== -1 ? (r[aiProv] || '').trim() : '';
    const iva = aiIva !== -1 && r[aiIva] !== '' ? fmtPct(r[aiIva]) : '';
    if (!products.has(codigo)) {
      products.set(codigo, { codigo, nombre, proveedor, iva, exi: 0, costo: 0, lotes: [] });
      order.push(codigo);
    }
  }

  for (const r of eb) {
    if (r.length <= eiArticulo) continue;
    const raw = (r[eiArticulo] || '').trim();
    const nombreExi = eiNombre !== -1 ? (r[eiNombre] || '').trim() : '';
    if (!raw || !nombreExi) continue;
    if (/registro\(s\)/i.test(raw)) continue; // fila de totales del reporte, no es un producto

    let codigo, resto;
    if (raw.includes('|')) {
      const i = raw.indexOf('|');
      codigo = raw.slice(0, i).trim();
      resto = raw.slice(i + 1).trim();
    } else { codigo = raw; resto = ''; }
    let lote, fecha;
    if (resto.includes(':')) {
      const i = resto.indexOf(':');
      lote = resto.slice(0, i).trim();
      fecha = resto.slice(i + 1).trim();
    } else { lote = resto; fecha = ''; }

    const cantidad = eiExi !== -1 ? toFloat(r[eiExi]) : 0;
    const costo = eiProm !== -1 ? toFloat(r[eiProm]) : 0;

    if (!products.has(codigo)) {
      products.set(codigo, { codigo, nombre: nombreExi, proveedor: '', iva: '', exi: 0, costo: 0, lotes: [] });
      order.push(codigo);
    }
    const p = products.get(codigo);
    p.exi += cantidad;
    if (costo > p.costo) p.costo = costo;
    p.lotes.push({ lote: cleanLoteFecha(lote), fecha: cleanLoteFecha(fecha), cantidad: fmtNum(cantidad), costo: fmtNum(costo) });
  }

  return order.map(k => {
    const p = products.get(k);
    return {
      codigo: p.codigo, nombre: p.nombre, proveedor: p.proveedor, iva: p.iva,
      exiFmt: fmtNum(p.exi), costoFmt: fmtNum(p.costo), lotes: p.lotes
    };
  });
}

// ---------------- carga desde carpeta conectada (File System Access API) ----------------

const IDB_NAME = 'inventario-uc';
const IDB_STORE = 'handles';

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function findFileInDir(dir, candidateNames) {
  for (const name of candidateNames) {
    try {
      const fh = await dir.getFileHandle(name);
      return await fh.getFile();
    } catch (e) { /* intenta el siguiente nombre */ }
  }
  return null;
}

async function loadFromDirectory(dir, statusEl) {
  statusEl.textContent = 'Buscando los archivos en la carpeta...';
  const [fArt, fExi] = await Promise.all([
    findFileInDir(dir, FILE_NAMES.articulos),
    findFileInDir(dir, FILE_NAMES.existencias)
  ]);
  const faltantes = [];
  if (!fArt) faltantes.push(FILE_NAMES.articulos[0]);
  if (!fExi) faltantes.push(FILE_NAMES.existencias[0]);
  if (faltantes.length) throw new Error('No se encontraron en la carpeta: ' + faltantes.join(', '));

  statusEl.textContent = 'Leyendo e interpretando los archivos...';
  const [artData, exiData] = await Promise.all([
    parseWorkbookFile(fArt, ['codigo']),
    parseWorkbookFile(fExi, ['articulo'])
  ]);
  return buildInventario(artData, exiData);
}

// handle guardado que solo necesita que se confirme el permiso (sin volver a elegir carpeta)
let pendingHandle = null;

async function connectFolder() {
  const statusEl = document.getElementById('loadStatus');
  statusEl.className = '';
  if (!window.showDirectoryPicker) {
    statusEl.className = 'error';
    statusEl.textContent = 'Tu navegador no soporta conectar carpetas directamente. Usa la opci\u00f3n de arrastrar/seleccionar los archivos.';
    return;
  }
  try {
    const handle = await window.showDirectoryPicker();
    dirHandle = handle;
    pendingHandle = null;
    await idbSet('inventario-dir', handle);
    resetConnectBtn();
    const products = await loadFromDirectory(handle, statusEl);
    finishLoad(products, statusEl);
  } catch (err) {
    if (err.name === 'AbortError') { statusEl.textContent = ''; return; }
    statusEl.className = 'error';
    statusEl.textContent = 'Error: ' + err.message;
  }
}

// solo confirma el permiso sobre la carpeta ya recordada (1 clic, sin dialogo de elegir carpeta)
async function reconnectPermission() {
  const statusEl = document.getElementById('loadStatus');
  statusEl.className = '';
  if (!pendingHandle) { connectFolder(); return; }
  try {
    const perm = await pendingHandle.requestPermission({ mode: 'read' });
    if (perm !== 'granted') {
      statusEl.className = 'error';
      statusEl.textContent = 'Permiso de lectura denegado para la carpeta.';
      return;
    }
    dirHandle = pendingHandle;
    pendingHandle = null;
    resetConnectBtn();
    statusEl.textContent = 'Cargando...';
    const products = await loadFromDirectory(dirHandle, statusEl);
    finishLoad(products, statusEl);
  } catch (err) {
    statusEl.className = 'error';
    statusEl.textContent = 'Error: ' + err.message;
  }
}

function resetConnectBtn() {
  const btn = document.getElementById('connectBtn');
  btn.textContent = '\ud83d\udcc1 Conectar carpeta';
}

async function tryAutoReconnect() {
  const statusEl = document.getElementById('loadStatus');
  if (!window.showDirectoryPicker) return;
  try {
    const handle = await idbGet('inventario-dir');
    if (!handle) return;
    const perm = await handle.queryPermission({ mode: 'read' });
    if (perm === 'granted') {
      dirHandle = handle;
      statusEl.textContent = 'Carpeta conectada encontrada, cargando...';
      try {
        const products = await loadFromDirectory(handle, statusEl);
        finishLoad(products, statusEl);
      } catch (err) {
        statusEl.className = 'error';
        statusEl.textContent = 'Error al leer la carpeta conectada: ' + err.message;
      }
    } else {
      // hay una carpeta recordada; solo falta confirmar el permiso (no hay que volver a elegirla)
      pendingHandle = handle;
      const btn = document.getElementById('connectBtn');
      btn.textContent = '\ud83d\udcc1 Reconectar carpeta (1 clic)';
    }
  } catch (e) { /* nada guardado aun */ }
}

// ---------------- carga manual (arrastrar / seleccionar archivos) ----------------

async function handleFiles(files) {
  const statusEl = document.getElementById('loadStatus');
  statusEl.className = '';
  const list = Array.from(files);
  const fArt = list.find(f => /listado.*articulo|articulo.*listado/i.test(f.name)) || list.find(f => !/existenc/i.test(f.name));
  const fExi = list.find(f => /existenc/i.test(f.name)) || list.find(f => f !== fArt);

  if (!fArt || !fExi || fArt === fExi) {
    statusEl.className = 'error';
    statusEl.textContent = 'Selecciona (o arrastra) los DOS archivos a la vez: el de art\u00edculos y el de existencias.';
    return;
  }

  try {
    statusEl.textContent = 'Leyendo e interpretando los archivos...';
    const [artData, exiData] = await Promise.all([
      parseWorkbookFile(fArt, ['codigo']),
      parseWorkbookFile(fExi, ['articulo'])
    ]);
    const products = buildInventario(artData, exiData);
    finishLoad(products, statusEl);
  } catch (err) {
    statusEl.className = 'error';
    statusEl.textContent = 'Error: ' + err.message;
  }
}

function finishLoad(products, statusEl) {
  if (!products.length) throw new Error('No se encontraron productos v\u00e1lidos.');
  PRODUCTS = products;
  statusEl.textContent = '';
  document.getElementById('headerSubtitle').textContent = products.length + ' art\u00edculos \u00b7 ' +
    products.filter(p => p.lotes.length).length + ' con existencia registrada';
  document.getElementById('loadScreen').style.display = 'none';
  document.getElementById('tableScreen').style.display = 'flex';
  document.getElementById('toolbar').style.display = 'flex';
  renderAll(products);
}

const ROW_H = 40, BUFFER = 8;
let ALL = [], view = [], sortKey = null, sortDir = 1;

function renderAll(products) {
  ALL = products.map(p => ({
    ...p,
    _codigo_n: normalize(p.codigo),
    _nombre_n: normalize(p.nombre),
    _proveedor_n: normalize(p.proveedor),
    _iva_n: normalize(p.iva),
    _exi_n: normalize(p.exiFmt),
    _costo_n: normalize(p.costoFmt),
  }));
  ALL.forEach(p => { p._full_n = [p._codigo_n, p._nombre_n, p._proveedor_n].join(' '); });
  view = ALL.slice();
  sortKey = null; sortDir = 1;

  const provSelect = document.querySelector('[data-colfilter="proveedor"]');
  const ivaSelect = document.querySelector('[data-colfilter="iva"]');
  const provs = [...new Set(ALL.map(p => p.proveedor).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
  const ivas = [...new Set(ALL.map(p => p.iva).filter(Boolean))].sort();
  provSelect.innerHTML = '<option value="">Todos</option>' + provs.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
  ivaSelect.innerHTML = '<option value="">Todos</option>' + ivas.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');

  document.querySelectorAll('[data-colfilter]').forEach(el => { if (el !== provSelect && el !== ivaSelect) el.value = ''; });

  refresh(true);
}

const viewport = document.getElementById('viewport');
const scroller = document.getElementById('scroller');
const rowsWindow = document.getElementById('rowsWindow');
const rowCountEl = document.getElementById('rowCount');
const emptyMsg = document.getElementById('emptyMsg');

function renderVisible() {
  const scrollTop = viewport.scrollTop;
  const viewportH = viewport.clientHeight;
  let start = Math.max(0, Math.floor(scrollTop / ROW_H) - BUFFER);
  let end = Math.min(view.length, Math.ceil((scrollTop + viewportH) / ROW_H) + BUFFER);
  rowsWindow.style.transform = `translateY(${start * ROW_H}px)`;
  const html = [];
  for (let i = start; i < end; i++) {
    const p = view[i];
    html.push(
      `<div class="grid-row data-row" data-codigo="${esc(p.codigo)}">` +
      `<div class="c-detalle"><button type="button" class="detail-btn" data-codigo="${esc(p.codigo)}" title="Ver detalle">&#128269;</button></div>` +
      `<div class="c-codigo">${esc(p.codigo)}</div>` +
      `<div class="c-nombre">${esc(p.nombre)}</div>` +
      `<div class="c-proveedor">${esc(p.proveedor)}</div>` +
      `<div class="c-iva">${esc(p.iva)}</div>` +
      `<div class="c-exi">${esc(p.exiFmt)}</div>` +
      `<div class="c-costo">${esc(p.costoFmt)}</div>` +
      `</div>`
    );
  }
  rowsWindow.innerHTML = html.join('');
}
function refresh(resetScroll) {
  scroller.style.height = (view.length * ROW_H) + 'px';
  if (resetScroll) viewport.scrollTop = 0;
  renderVisible();
  rowCountEl.textContent = view.length === ALL.length ? `${ALL.length} art\u00edculos` : `${view.length} de ${ALL.length} art\u00edculos`;
  emptyMsg.style.display = view.length === 0 ? 'block' : 'none';
}
let scrollTicking = false;
viewport.addEventListener('scroll', () => {
  if (scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(() => { renderVisible(); scrollTicking = false; });
});
window.addEventListener('resize', () => renderVisible());

function applyFilters() {
  const query = normalize(document.getElementById('searchBox').value.trim());
  const tokens = query.split(/\s+/).filter(Boolean);
  const vals = {};
  document.querySelectorAll('[data-colfilter]').forEach(el => { vals[el.dataset.colfilter] = normalize(el.value.trim()); });

  let out = ALL.filter(p => {
    if (tokens.length && !tokens.every(t => p._full_n.includes(t))) return false;
    if (vals.codigo && !p._codigo_n.includes(vals.codigo)) return false;
    if (vals.nombre && !p._nombre_n.includes(vals.nombre)) return false;
    if (vals.proveedor && p._proveedor_n !== vals.proveedor) return false;
    if (vals.iva && p._iva_n !== vals.iva) return false;
    if (vals.exi && !p._exi_n.includes(vals.exi)) return false;
    if (vals.costo && !p._costo_n.includes(vals.costo)) return false;
    return true;
  });

  if (sortKey) {
    out.sort((a, b) => {
      const nk = '_' + sortKey + '_n';
      return a[nk].localeCompare(b[nk], 'es', { sensitivity: 'base', numeric: true }) * sortDir;
    });
  }
  view = out;
  refresh(true);
}

document.getElementById('searchBox').addEventListener('input', applyFilters);
document.querySelectorAll('[data-colfilter]').forEach(el => {
  el.addEventListener('input', applyFilters);
  el.addEventListener('change', applyFilters);
});
document.getElementById('clearFilters').addEventListener('click', () => {
  document.getElementById('searchBox').value = '';
  document.querySelectorAll('[data-colfilter]').forEach(el => el.value = '');
  applyFilters();
});
document.getElementById('headRow').querySelectorAll('[data-key]').forEach(div => {
  div.addEventListener('click', () => {
    const key = div.dataset.key;
    sortDir = (sortKey === key) ? -sortDir : 1;
    sortKey = key;
    document.querySelectorAll('.head-row .arrow').forEach(a => a.remove());
    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = sortDir === 1 ? '\u25B2' : '\u25BC';
    div.appendChild(arrow);
    applyFilters();
  });
});

// ---------------- movimientos del articulo ----------------

function movDecode(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}
function movNum(s) {
  if (typeof s === 'number') return s;
  s = String(s == null ? '' : s).trim();
  if (!s || s === '_') return null;
  const neg = /^\(.*\)$/.test(s) || s.charAt(0) === '-';
  const v = parseFloat(s.replace(/[(),\s-]/g, ''));
  return isNaN(v) ? null : (neg ? -v : v);
}
function movQf(x) { return x.toLocaleString('es-CO', { maximumFractionDigits: 2 }); }
function movPf(x) { return x == null ? '\u2014' : x.toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function movRev(s) { return s ? s.split('-').reverse().join('-') : '\u2014'; }

function rowsFromMovHtml(text) {
  const doc = new DOMParser().parseFromString(text, 'text/html');
  return Array.from(doc.querySelectorAll('tr')).map(tr =>
    Array.from(tr.children).map(c => c.textContent.replace(/\u00a0/g, ' ').trim())
  );
}
function rowsFromMovBook(buf) {
  const wb = XLSX.read(buf, { type: 'array' });
  let all = [];
  wb.SheetNames.forEach(n => { all = all.concat(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' })); });
  return all.map(r => r.map(c => String(c).trim()));
}

function parseMovimientos(rows) {
  const out = [];
  let cur = null;
  rows.forEach((r, i) => {
    const c0 = (r[0] || '').trim();
    let m;

    // Cabecera de articulo. Variantes: (COD), (COD LOTE:AAAA-MM-DD), (COD ||:||)
    if ((m = c0.match(/^Articulo:\s*\(([^)]*)\)\s*(.*)$/i))) {
      const inner = m[1].trim();
      const nom = m[2] || '';
      const parts = inner.split(/\s+/);
      const cod = (parts[0] || '').trim();
      const rest = parts.slice(1).join(' ').trim();
      let lot = '\u2014', ven = '';
      if (rest) {
        const lm = rest.match(/^([^:]*):(.*)$/);
        if (lm) {
          lot = lm[1].replace(/\|/g, '').trim() || '\u2014';
          ven = lm[2].replace(/\|/g, '').trim();
        } else {
          lot = rest.replace(/\|/g, '').trim() || '\u2014';
        }
      }
      cur = { cod, lot, ven, nom };
      return;
    }
    if (!cur) return;

    // Fecha: primero ISO (AAAA-MM-DD), si no DD-MM-AA(AA)
    let y, mn, dd, d;
    if ((d = c0.match(/^(\d{4})-(\d{2})-(\d{2})/))) { y = d[1]; mn = d[2]; dd = d[3]; }
    else if ((d = c0.match(/^(\d{2})-(\d{2})-(\d{2,4})/))) { dd = d[1]; mn = d[2]; y = d[3].length === 2 ? '20' + d[3] : d[3]; }
    else return;

    const qi = movNum(r[4]), vi = movNum(r[5]), pi = movNum(r[6]);
    const qo = movNum(r[7]), vo = movNum(r[8]), po = movNum(r[9]);
    const sal = qo != null || vo != null;
    const ini = /INICIO/i.test((r[1] || '') + ' ' + (r[2] || ''));
    let q = sal ? qo : qi; if (q == null) q = 0;
    let p = sal ? po : pi;
    if (p == null) { const v = sal ? vo : vi; if (v != null && q) p = v / q; }
    out.push({
      cod: cur.cod, nom: cur.nom,
      tipo: ini ? 'Saldo inicial' : (sal ? 'Salida' : 'Entrada'),
      sal, q, precio: sal ? p : null, costo: sal ? null : p,
      f: y + '-' + mn + '-' + dd,
      lot: cur.lot, ven: cur.ven, o: i,
      doc: (r[1] || '').trim(),
      tercero: (r[3] || '').trim()
    });
  });
  out.sort((a, b) => a.f < b.f ? -1 : a.f > b.f ? 1 : a.o - b.o);
  return out;
}

function renderMovimientos(list) {
  const arts = {};
  let h = '';
  list.forEach(m => { (arts[m.cod] = arts[m.cod] || []).push(m); });
  Object.keys(arts).forEach(cod => {
    let rs = arts[cod];
    const used = {};
    rs.forEach(m => { if (m.q !== 0) used[m.lot] = 1; });
    rs = rs.filter(m => used[m.lot]);
    const st = {};
    rs.forEach(m => {
      const s = st[m.lot] = st[m.lot] || { lot: m.lot, ven: m.ven, q: 0 };
      s.q += m.sal ? -m.q : m.q;
    });
    const sl = Object.keys(st).map(k => st[k]).filter(s => s.q !== 0)
      .sort((a, b) => a.ven < b.ven ? -1 : a.ven > b.ven ? 1 : 0);
    const tt = sl.reduce((a, s) => a + s.q, 0);

    h += '<div class="hd"><div><h2>' + esc(cod) + '</h2><span>' + esc(rs.length ? rs[0].nom : arts[cod][0].nom) + '</span></div>' +
      '<div class="tot"><small>Total actual</small><b' + (tt < 0 ? ' class="neg"' : '') + '>' + movQf(tt) + '</b></div></div>';

    h += '<h3>Existencias por lote</h3><div class="card"><table><thead><tr><th>Lote</th><th>Fecha de vencimiento</th><th class="n">Cantidad</th></tr></thead><tbody>';
    h += sl.length
      ? sl.map(s => '<tr><td>' + esc(s.lot) + '</td><td>' + movRev(s.ven) + '</td><td class="n' + (s.q < 0 ? ' neg' : '') + '">' + movQf(s.q) + '</td></tr>').join('')
      : '<tr><td colspan="3">Sin existencias</td></tr>';
    h += '</tbody></table></div>';

    h += '<h3>Movimientos</h3><div class="card"><table><thead><tr>' +
      '<th>Tipo de movimiento</th><th>Documento</th><th>Tercero</th><th class="n">Cantidad</th>' +
      '<th class="n">Precio (salidas)</th><th class="n">Costo (entradas)</th><th>Fecha</th>' +
      '<th>Lote</th><th>Fecha de vencimiento</th>' +
      '</tr></thead><tbody>';
    h += rs.map(m =>
      '<tr>' +
      '<td>' + m.tipo + '</td>' +
      '<td class="doc">' + esc(m.doc || '\u2014') + '</td>' +
      '<td class="doc">' + esc(m.tercero || '\u2014') + '</td>' +
      '<td class="n' + (m.sal ? ' neg' : '') + '">' + (m.sal ? '-' : '') + movQf(m.q) + '</td>' +
      '<td class="n">' + movPf(m.precio) + '</td>' +
      '<td class="n">' + movPf(m.costo) + '</td>' +
      '<td>' + movRev(m.f) + '</td>' +
      '<td>' + esc(m.lot) + '</td>' +
      '<td>' + movRev(m.ven) + '</td>' +
      '</tr>'
    ).join('');
    h += '</tbody></table></div>';
  });
  document.getElementById('movOut').innerHTML = h;
}

async function loadMovimientosFile(file) {
  const msgEl = document.getElementById('movMsg');
  msgEl.textContent = '';
  if (!file) return;
  try {
    const buf = await readFileAsArrayBuffer(file);
    const head = movDecode(buf.slice(0, 4000));
    let rows;
    if (/<\s*(html|table|tr|body)/i.test(head)) {
      rows = rowsFromMovHtml(movDecode(buf));
    } else {
      await loadSheetJS();
      rows = rowsFromMovBook(buf);
    }
    const list = parseMovimientos(rows);
    if (!list.length) { msgEl.textContent = 'No se encontraron movimientos en este archivo.'; return; }
    renderMovimientos(list);
    document.getElementById('movScreen').classList.add('has-data');
    document.getElementById('movScroll').scrollTop = 0;
  } catch (err) {
    msgEl.textContent = 'No se pudo leer el archivo: ' + err.message;
  }
}

document.getElementById('movBtn').addEventListener('click', () => {
  document.getElementById('tableScreen').style.display = 'none';
  document.getElementById('movScreen').classList.add('open');
});
document.getElementById('movBackBtn').addEventListener('click', () => {
  document.getElementById('movScreen').classList.remove('open');
  document.getElementById('tableScreen').style.display = 'flex';
  requestAnimationFrame(renderVisible);
});
document.getElementById('movFile').addEventListener('change', (e) => {
  loadMovimientosFile(e.target.files[0]);
  e.target.value = '';
});
const movDropZone = document.getElementById('movDropZone');
['dragenter', 'dragover'].forEach(evt => movDropZone.addEventListener(evt, (e) => { e.preventDefault(); movDropZone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(evt => movDropZone.addEventListener(evt, (e) => { e.preventDefault(); movDropZone.classList.remove('dragover'); }));
movDropZone.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) loadMovimientosFile(e.dataTransfer.files[0]); });

// ---------------- botones generales ----------------

document.getElementById('connectBtn').addEventListener('click', () => {
  if (pendingHandle) reconnectPermission();
  else connectFolder();
});

document.getElementById('refreshBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('loadStatus');
  if (dirHandle) {
    try {
      const perm = await dirHandle.requestPermission({ mode: 'read' });
      if (perm !== 'granted') throw new Error('Permiso de lectura denegado.');
      const products = await loadFromDirectory(dirHandle, statusEl);
      PRODUCTS = products;
      document.getElementById('headerSubtitle').textContent = products.length + ' art\u00edculos \u00b7 ' +
        products.filter(p => p.lotes.length).length + ' con existencia registrada';
      renderAll(products);
    } catch (err) {
      alert('No se pudo actualizar: ' + err.message);
    }
  } else {
    document.getElementById('tableScreen').style.display = 'none';
    document.getElementById('toolbar').style.display = 'none';
    document.getElementById('loadScreen').style.display = 'flex';
  }
});

document.getElementById('loadAnother').addEventListener('click', () => {
  document.getElementById('tableScreen').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('loadScreen').style.display = 'flex';
  document.getElementById('loadStatus').textContent = '';
});

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFiles(fileInput.files); });
['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
dropzone.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

// intento de reconexion automatica al abrir la pagina
tryAutoReconnect();
</script>

</body>
</html>
